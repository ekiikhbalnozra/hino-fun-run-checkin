<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Hino Fun Run 2026 - QR Check-in</title>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; background: #f3f4f6;
      color: #111827;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 18px; }
    .card {
      background: #fff; border-radius: 18px; padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.10);
    }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { color:#6b7280; margin-bottom:16px; }
    #reader {
      width: 100%; overflow: hidden; border-radius: 14px;
      border: 2px solid #ddd;
    }
    button {
      width: 100%; border: 0; border-radius: 12px; padding: 15px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      background: #e30613; color: #fff; margin-top: 12px;
    }
    button.secondary { background:#4b5563; }
    .result {
      margin-top: 16px; padding: 15px; border-radius: 12px;
      background:#eef2f7; line-height:1.55;
    }
    .ok { background:#dcfce7; color:#166534; }
    .warn { background:#fef3c7; color:#92400e; }
    .err { background:#fee2e2; color:#991b1b; }
    .manual { margin-top:18px; padding-top:16px; border-top:1px solid #e5e7eb; }
    input {
      width:100%; padding:14px; border:1px solid #d1d5db; border-radius:10px;
      font-size:17px; text-transform:uppercase;
    }
    small { color:#6b7280; display:block; margin-top:10px; line-height:1.4; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Hino Fun Run 2026</h1>
    <div class="sub">CHECK-IN PESERTA — QR SCANNER</div>

    <div id="reader"></div>
    <button id="startBtn">AKTIFKAN KAMERA</button>

    <div id="result" class="result">
      Siap. Tekan <b>AKTIFKAN KAMERA</b>, izinkan kamera, lalu arahkan ke QR BIB.
    </div>

    <div class="manual">
      <b>Backup: input BIB manual</b>
      <input id="manualBib" placeholder="Contoh: M26001" autocomplete="off">
      <button id="manualBtn">CHECK-IN MANUAL</button>
      <small>
        Setelah QR terbaca, scanner akan membuka sistem Check-in Hino dan
        BIB tersebut diproses otomatis.
      </small>
    </div>
  </div>
</div>

<script>
  const APP_URL =
    "https://script.google.com/macros/s/AKfycbzAhqm744ZPESuxOcTzybAFfnLlU_r7Y6b2VOvogkoGTEiyO2B5an1bZ5AQW0_UsxGz/exec";

  let scanner = null;
  let locked = false;

  function show(msg, cls="result") {
    const el = document.getElementById("result");
    el.className = "result " + cls;
    el.innerHTML = msg;
  }

  function extractBib(text) {
    text = String(text || "").trim();
    // Accept either a plain BIB (M26001/F26001) or the existing Apps Script URL.
    const m = text.match(/(?:[?&]bib=)([A-Za-z0-9_-]+)/i);
    if (m) return m[1].toUpperCase();
    if (/^[MF]\d{5}$/i.test(text)) return text.toUpperCase();
    return "";
  }

  function goToCheckin(bib) {
    if (!bib || locked) return;
    locked = true;
    show("QR terbaca: <b>" + bib + "</b><br>Membuka sistem check-in...", "ok");
    if (scanner) {
      scanner.stop().catch(()=>{});
    }
    // Top-level navigation: no cross-origin fetch/CORS is required.
    window.location.href = APP_URL + "?bib=" + encodeURIComponent(bib);
  }

  async function startScanner() {
    if (scanner) return;
    if (typeof Html5Qrcode === "undefined") {
      show("Scanner belum siap. Periksa koneksi internet lalu coba lagi.", "err");
      return;
    }

    scanner = new Html5Qrcode("reader");
    const config = {
      fps: 10,
      qrbox: { width: 260, height: 260 },
      aspectRatio: 1.0
    };

    try {
      await scanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          const bib = extractBib(decodedText);
          if (bib) {
            goToCheckin(bib);
          } else {
            show("QR terbaca, tetapi format BIB tidak dikenali:<br><b>" +
                  decodedText + "</b>", "warn");
          }
        },
        () => {}
      );
      document.getElementById("startBtn").style.display = "none";
      show("Kamera aktif. Arahkan ke QR pada BIB.", "result");
    } catch (e) {
      scanner = null;
      show(
        "<b>Kamera tidak dapat diaktifkan.</b><br>" +
        "Pastikan halaman dibuka melalui HTTPS dan izin kamera diberikan. " +
        "Jika tetap gagal, gunakan input BIB manual di bawah.",
        "err"
      );
    }
  }

  document.getElementById("startBtn").addEventListener("click", startScanner);

  document.getElementById("manualBtn").addEventListener("click", () => {
    const bib = document.getElementById("manualBib").value.trim().toUpperCase();
    if (!/^[MF]\d{5}$/.test(bib)) {
      show("Format BIB tidak valid. Contoh: <b>M26001</b>.", "warn");
      return;
    }
    goToCheckin(bib);
  });
</script>
</body>
</html>
