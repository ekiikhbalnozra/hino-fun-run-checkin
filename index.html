<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Hino Fun Run 2026 - QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.10);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .sub {
      color:#6b7280;
      margin-bottom:16px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      border: 2px solid #ddd;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #e30613;
      color: #fff;
      margin-top: 12px;
    }

    button.secondary {
      background:#4b5563;
    }

    .result {
      margin-top: 16px;
      padding: 15px;
      border-radius: 12px;
      background:#eef2f7;
      line-height:1.55;
    }

    .ok {
      background:#dcfce7;
      color:#166534;
    }

    .warn {
      background:#fef3c7;
      color:#92400e;
    }

    .err {
      background:#fee2e2;
      color:#991b1b;
    }

    .manual {
      margin-top:18px;
      padding-top:16px;
      border-top:1px solid #e5e7eb;
    }

    input {
      width:100%;
      padding:14px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:17px;
      text-transform:uppercase;
    }

    small {
      color:#6b7280;
      display:block;
      margin-top:10px;
      line-height:1.4;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Hino Fun Run 2026</h1>

    <div class="sub">
      CHECK-IN PESERTA — QR SCANNER
    </div>

    <div id="reader"></div>

    <button id="startBtn">
      AKTIFKAN KAMERA
    </button>

    <div id="result" class="result">
      Siap. Tekan <b>AKTIFKAN KAMERA</b>, izinkan kamera,
      lalu arahkan ke QR BIB.
    </div>

    <div class="manual">

      <b>Backup: input BIB manual</b>

      <input
        id="manualBib"
        placeholder="Contoh: M26001"
        autocomplete="off"
      >

      <button id="manualBtn">
        CHECK-IN MANUAL
      </button>

      <small>
        Setelah QR terbaca, sistem akan melakukan check-in
        otomatis tanpa membuka Google Drive.
      </small>

    </div>

  </div>
</div>

<script>

const APP_URL =
"https://script.google.com/macros/s/AKfycbzAhqm744ZPESuxOcTzybAFfnLlU_r7Y6b2VOvogkoGTEiyO2B5an1bZ5AQW0_UsxGz/exec";

let scanner = null;
let locked = false;


/* =========================
   TAMPILKAN PESAN
========================= */

function show(msg, cls="result") {

  const el = document.getElementById("result");

  el.className = "result " + cls;

  el.innerHTML = msg;

}


/* =========================
   AMBIL NOMOR BIB DARI QR
========================= */

function extractBib(text) {
  text = String(text || "").trim();

  // Membaca QR dengan format:
  // ?b=M26005
  // atau:
  // ?bib=M26005

  const m = text.match(/(?:[?&](?:b|bib)=)([A-Za-z0-9_-]+)/i);

  if (m) {
    return m[1].toUpperCase();
  }

  // Jika QR langsung berisi nomor BIB
  if (/^[A-Z]\d{5}$/i.test(text)) {
    return text.toUpperCase();
  }

  return "";
}


/* =========================
   KIRIM CHECK-IN
   TANPA PINDAH HALAMAN
========================= */

function processCheckin(bib) {

  if (!bib || locked) return;

  locked = true;

  show(
    "QR TERBACA: <b>" + bib + "</b><br>" +
    "Membuka sistem check-in...",
    "ok"
  );

  if (scanner) {
    scanner.stop().catch(() => {});
    scanner = null;
  }

  // Kirim BIB langsung ke Apps Script
  // melalui navigasi HTTPS.
  // Apps Script akan melakukan check-in
  // kemudian mengembalikan pengguna ke GitHub.

  const url =
    APP_URL +
    "?bib=" +
    encodeURIComponent(bib);

  window.location.href = url;
}

/* =========================
   HASIL DARI APPS SCRIPT
========================= */

(function handleResult() {

  const params =
    new URLSearchParams(window.location.search);

  const status =
    params.get('status');

  const bib =
    params.get('bib');

  const message =
    params.get('message');


  if (!status || !bib) {
    return;
  }


  if (status === 'SUCCESS') {

    show(
      "<b>✓ CHECK-IN BERHASIL</b><br><br>" +
      "BIB: <b>" + bib + "</b><br>" +
      "Data sudah masuk ke Google Sheet.",
      "ok"
    );

  }

  else if (status === 'DUPLICATE') {

    show(
      "<b>⚠ PESERTA SUDAH CHECK-IN</b><br><br>" +
      "BIB: <b>" + bib + "</b>",
      "warn"
    );

  }

  else if (status === 'NOT_FOUND') {

    show(
      "<b>✕ BIB TIDAK DITEMUKAN</b><br><br>" +
      "BIB: <b>" + bib + "</b>",
      "err"
    );

  }

  else {

    show(
      "<b>✕ CHECK-IN GAGAL</b><br><br>" +
      "BIB: <b>" + bib + "</b><br>" +
      (message || "Terjadi kesalahan."),
      "err"
    );

  }


  // Bersihkan parameter URL
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

})();
  
/* =========================
   START CAMERA
========================= */

async function startScanner() {

  if (scanner) return;


  if (typeof Html5Qrcode === "undefined") {

    show(
      "Scanner belum siap. " +
      "Periksa koneksi internet lalu coba lagi.",
      "err"
    );

    return;
  }


  scanner = new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 260,
      height: 260
    },

    aspectRatio: 1.0

  };


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      (decodedText) => {

        const bib = extractBib(decodedText);


        if (bib) {

          processCheckin(bib);

        } else {

          show(
            "QR terbaca, tetapi format BIB tidak dikenali:<br>" +
            "<b>" + decodedText + "</b>",
            "warn"
          );

        }

      },

      () => {}

    );


    document.getElementById(
      "startBtn"
    ).style.display = "none";


    show(
      "Kamera aktif.<br>" +
      "Arahkan kamera ke QR pada BIB.",
      "result"
    );


  } catch (e) {

    scanner = null;

    show(
      "<b>Kamera tidak dapat diaktifkan.</b><br>" +
      "Pastikan halaman dibuka melalui HTTPS " +
      "dan izin kamera diberikan.<br><br>" +
      "Jika tetap gagal, gunakan input BIB manual.",
      "err"
    );

  }

}


/* =========================
   TOMBOL KAMERA
========================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startScanner
  );


/* =========================
   CHECK-IN MANUAL
========================= */

document
  .getElementById("manualBtn")
  .addEventListener(
    "click",
    () => {

      const bib =
        document
        .getElementById("manualBib")
        .value
        .trim()
        .toUpperCase();


      if (!/^[MF]\d{5}$/.test(bib)) {

        show(
          "Format BIB tidak valid.<br>" +
          "Contoh: <b>M26001</b>.",
          "warn"
        );

        return;
      }


      processCheckin(bib);

    }
  );

</script>

</body>
</html>
